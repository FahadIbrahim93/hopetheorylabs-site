name: Regenerate HTL brand book (issues 64 and 65)
on:
  push:
    branches:
      - fix/brand-book-ai-audit-icon-64-65
    paths:
      - "brand/guidelines/src/**"
      - ".github/workflows/htl-brandbook-rebuild.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
      - name: Install official OFL fonts and render dependencies
        run: |
          python -m pip install markdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fontconfig
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git /tmp/htl-fonts
          cd /tmp/htl-fonts
          git sparse-checkout set ofl/instrumentsans ofl/newsreader ofl/jetbrainsmono
          mkdir -p "$HOME/.local/share/fonts/HTL"
          find ofl/instrumentsans ofl/newsreader ofl/jetbrainsmono -iname '*.ttf' -exec cp {} "$HOME/.local/share/fonts/HTL/" \;
          fc-cache -f
      - name: Rebuild PDF, validate messaging and commit to review branch
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME
          git show origin/main:brand/guidelines/HTL-Brand-Guidelines.pdf >/tmp/htl-original.pdf
          python brand/_source/build_guidelines.py
          before="$(pdfinfo /tmp/htl-original.pdf | awk '/^Pages:/ {print $2}')"
          after="$(pdfinfo brand/guidelines/HTL-Brand-Guidelines.pdf | awk '/^Pages:/ {print $2}')"
          echo "Original pages: $before; rebuilt pages: $after"
          test "$before" = "$after"
          pdftotext -layout brand/guidelines/HTL-Brand-Guidelines.pdf /tmp/htl-new.txt
          python - <<'PY'
          from pathlib import Path
          t=Path('/tmp/htl-new.txt').read_text()
          for phrase in ('AI Audit', 'Forward-Deployed AI Engineering', 'The six service pillars'):
              assert phrase in t, f'Missing: {phrase}'
          for phrase in ('clients worldwide', 'founding rate', 'The five service pillars', 'Website packages for small retail'):
              assert phrase.lower() not in t.lower(), f'Stale copy: {phrase}'
          print('PDF messaging validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/guidelines/HTL-Brand-Guidelines.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date"
          else
            git commit -m "docs(brand): regenerate AI-first brand book PDF (#64)"
            git push origin HEAD:fix/brand-book-ai-audit-icon-64-65
          fi
